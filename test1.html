<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Accident Dispatch & Reroute Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .header-bar {
            position: absolute;
            top: 15px;
            left: 50px;
            z-index: 1000;
            background: rgba(183, 28, 28, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }
        .status-indicator {
            position: absolute;
            bottom: 25px;
            left: 25px;
            z-index: 1000;
            background: #212121;
            color: #eeeeee;
            padding: 12px 18px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            font-size: 13px;
            border-left: 4px solid #ff9100;
        }
    </style>
</head>
<body>

    <div class="header-bar">🚨 Emergency Services Live Dispatch Map</div>
    <div id="map"></div>
    <div class="status-indicator" id="statusBox">📡 Listening for hardware cloud stream...</div>

    <script>
        // 1. Initial startup view: Set map focus location coordinates over Mauritius
        let defaultCenter = [-20.2000, 57.5000];
        const map = L.map('map').setView(defaultCenter, 11);

        // 2. Load and draw open-source global street map textures
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Create a global placeholder marker instance that moves dynamically
        let liveAccidentMarker = L.marker([0, 0]);
        let isMarkerActive = false;

        // 3. The Live Sync Engine: Pulls live updates from the cloud feed
        async function checkForAccidents() {
            try {
                // Fetch the absolute newest coordinate line sent up by the Arduino loop
                const response = await fetch('https://dweet.io/get/latest/dweet/for/mauritius-vehicle-fire-tracker');
                const data = await response.json();

                if (data.with && data.with.length > 0) {
                    const latestData = data.with[0].content;
                    const lat = parseFloat(latestData.lat);
                    const lon = parseFloat(latestData.lon);

                    // Ensure valid numbers are received before updating layout
                    if (!isNaN(lat) && !isNaN(lon)) {
                        const newLocation = [lat, lon];

                        // Instantly plot or relocate the marker without a browser page reload
                        if (!isMarkerActive) {
                            liveAccidentMarker.setLatLng(newLocation).addTo(map);
                            isMarkerActive = true;
                        } else {
                            liveAccidentMarker.setLatLng(newLocation);
                        }

                        // Attach information bubble layout directly to that pin
                        liveAccidentMarker.bindPopup(`
                            <div style="font-family: Arial; padding: 5px;">
                                <b style="color:#d32f2f; font-size:14px;">🚨 LIVE EMERGENCY RESPONSE</b><br><br>
                                <b>Dispatch Status:</b> Fire Station Alerted via SMS!<br>
                                <b>Incident Sector:</b> ${lat.toFixed(5)}, ${lon.toFixed(5)}<br><br>
                                <span style="color:#e65100; font-weight:bold;">⚠️ ROAD BLOCKED: Reroute immediately!</span>
                            </div>
                        `).openPopup();

                        // Glide the camera window directly to the incident zone smoothly
                        map.setView(newLocation, 14);
                        
                        // Update UI status notification footer box
                        const statusElement = document.getElementById('statusBox');
                        statusElement.innerHTML = `🔴 <b>CRITICAL ALARM CAUGHT!</b> Map updated: ${new Date().toLocaleTimeString()}`;
                        statusElement.style.borderLeft = "4px solid #d32f2f";
                    }
                }
            } catch (error) {
                console.log("Awaiting fresh device packets...", error);
            }
        }

        // Run the background checking loop automatically every 3 seconds (3000ms)
        setInterval(checkForAccidents, 3000);
    </script>

</body>
</html>
